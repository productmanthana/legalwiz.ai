          required: [original, history]
          properties:
            original:
              type: object
              required: [description, debit, credit, txnDate]
              properties:
                description: { type: string }
                debit: { type: number }
                credit: { type: number }
                txnDate: { type: string, format: date }
                balance: { type: ["number", "null"] }
            history:
              type: array
              items: { $ref: "#/components/schemas/AuditLog" }
    TransactionUpdate:
      type: object
      properties:
        category: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
        explanation: { type: ["string", "null"] }
        familyMemberId: { type: ["integer", "null"] }
        reviewStatus: { type: string, enum: [pending, reviewed, flagged] }
        documentIds: { type: array, items: { type: integer } }
        correctedDescription: { type: string }
        correctedDebit: { type: number }
        correctedCredit: { type: number }
        correctedTxnDate: { type: string, format: date }
        correctionReason: { type: string, description: Required when correcting imported values }

    TransactionMatch:
      type: object
      required: [id, caseId, matchType, confidence, status, sourceTransactions, targetTransactions, amount, evidence, createdBy]
      properties:
        id: { type: integer }
        caseId: { type: integer }
        matchType:
          type: string
          enum: [own_account_transfer, family_transfer, cash_withdrawal_redeposit, duplicate_credit, loan_receipt_repayment, investment_purchase_redemption, other]
