    patch:
      operationId: updateQueryResponse
      tags: [queries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryResponseUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResponse" }
  /queries/{queryId}/assessments:
    parameters:
      - { name: queryId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: createAssessment
