        credit: { type: number }
        balance: { type: ["number", "null"] }
        financialYear: { type: string, description: e.g. 2019-20 }
        category: { type: ["string", "null"] }
        suggestedCategory: { type: ["string", "null"] }
        suggestionReason: { type: ["string", "null"] }
        classificationStatus: { type: string, enum: [unclassified, suggested, approved] }
        reviewStatus: { type: string, enum: [pending, reviewed, flagged] }
        reconciliationStatus: { type: string, enum: [unreconciled, partially_reconciled, reconciled, manual_review] }
        tags: { type: array, items: { type: string } }
        explanation: { type: ["string", "null"] }
        familyMemberId: { type: ["integer", "null"] }
        documentIds: { type: array, items: { type: integer } }
        isEdited: { type: boolean, description: True when a user corrected imported values; originals preserved in history }
