        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }

  /cases/{caseId}/documents:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listDocuments
      tags: [documents]
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }
    post:
      operationId: createDocument
      tags: [documents]
      summary: Register an uploaded document (file already uploaded via presigned URL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /documents/{documentId}:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateDocument
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUpdate" }
      responses:
        "200":
          description: Updated metadata (file itself is never altered)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    delete:
      operationId: archiveDocument
      tags: [documents]
      summary: Archive a document (original file retained)
      responses:
        "204": { description: Archived }
  /documents/{documentId}/reindex:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: reindexDocument
      tags: [documents]
      summary: Re-run text/vision extraction and search indexing for a document
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }

  /legal-references:
