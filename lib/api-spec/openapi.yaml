        familyMemberId: { type: ["integer", "null"] }
        sourceReference: { type: ["string", "null"] }
        documentIds: { type: array, items: { type: integer } }
        verificationStatus: { type: string, enum: [user_provided, documented, verified] }
    ScheduleLine:
