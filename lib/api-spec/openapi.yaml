        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: court, in: query, schema: { type: string } }
        - { name: verificationStatus, in: query, schema: { type: string } }
      responses:
        "200":
          description: Legal references
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LegalReference" }
    post:
      operationId: createLegalReference
      tags: [legal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalReferenceInput" }
      responses:
        "201":
          description: Created (always starts as unverified)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalReference" }
  /legal-references/{referenceId}:
    parameters:
      - { name: referenceId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getLegalReference
      tags: [legal]
      responses:
        "200":
          description: Reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalReference" }
    patch:
      operationId: updateLegalReference
      tags: [legal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalReferenceInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalReference" }
  /legal-references/{referenceId}/verify:
    parameters:
      - { name: referenceId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: verifyLegalReference
      tags: [legal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalVerificationInput" }
      responses:
        "200":
          description: Verification recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalReference" }
  /cases/{caseId}/legal-links:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listCaseLegalLinks
      tags: [legal]
      responses:
        "200":
          description: Legal references attached to this case
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseLegalLink" }
    post:
      operationId: createCaseLegalLink
      tags: [legal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseLegalLinkInput" }
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseLegalLink" }
  /legal-links/{linkId}:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: integer } }
    delete:
      operationId: deleteCaseLegalLink
      tags: [legal]
      responses:
        "204": { description: Removed }

  /cases/{caseId}/assistant/messages:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listAssistantMessages
      tags: [assistant]
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantMessage" }
    post:
      operationId: askAssistant
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantQuestion" }
      responses:
        "200":
          description: Assistant answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantMessage" }

  /report-types:
    get:
      operationId: listReportTypes
      tags: [reports]
      responses:
        "200":
          description: Available report types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportType" }
  /cases/{caseId}/reports:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listGeneratedReports
      tags: [reports]
      responses:
        "200":
          description: Export history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GeneratedReport" }
  /cases/{caseId}/reports/export:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
      - { name: type, in: query, required: true, schema: { type: string } }
      - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, pdf, docx] } }
    get:
      operationId: exportReport
      tags: [reports]
      summary: Download a generated report file (use a plain link, not the hook)
      responses:
        "200":
          description: File
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      parameters:
        - { name: caseId, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Audit trail (append-only)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400":
          description: Invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      parameters:
        - { name: objectPath, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CountResult:
      type: object
      required: [count]
      properties:
        count: { type: integer }
        message: { type: string }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }

    UserProfile:
      type: object
      required: [id, email, displayName, workspace, role, onboarded]
      properties:
        id: { type: integer }
        email: { type: string }
        displayName: { type: string }
        workspace:
          type: string
          enum: [client, investigation]
          description: client = accused/advocate/CA workspace; investigation = authorised officer workspace
        role:
          type: string
          enum: [individual, advocate, chartered_accountant, investigation_officer, admin]
        organisation: { type: ["string", "null"] }
        onboarded: { type: boolean }
    SignUpBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
    SignInBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    UserProfileUpdate:
      type: object
      properties:
        displayName: { type: string }
        workspace: { type: string, enum: [client, investigation] }
        role: { type: string, enum: [individual, advocate, chartered_accountant, investigation_officer] }
        organisation: { type: ["string", "null"] }
    ServiceStatus:
      type: object
      required: [key, name, available, detail]
      properties:
        key: { type: string }
        name: { type: string }
        available: { type: boolean }
        detail: { type: string }

    DashboardSummary:
      type: object
      required: [activeCases, casesByType, bankAccounts, transactions, awaitingClassification, awaitingReconciliation, missingDocuments, pendingQueries, responsesAwaitingReview, financialYears, documents]
      properties:
        activeCases: { type: integer }
        casesByType:
          type: array
          items:
            type: object
            required: [caseType, count]
            properties:
              caseType: { type: string }
              count: { type: integer }
        bankAccounts: { type: integer }
        transactions: { type: integer }
        awaitingClassification: { type: integer }
        awaitingReconciliation: { type: integer }
        missingDocuments: { type: integer, description: High-value transactions without a linked supporting document }
        pendingQueries: { type: integer }
        responsesAwaitingReview: { type: integer }
        financialYears: { type: array, items: { type: string } }
        documents: { type: integer }
        recentDocuments:
          type: array
          items: { $ref: "#/components/schemas/Document" }
    FinancialYearTotal:
      type: object
      required: [financialYear, credits, debits, count]
      properties:
        financialYear: { type: string }
        credits: { type: number }
        debits: { type: number }
        count: { type: integer }
    Deadline:
      type: object
      required: [kind, title, dueDate, caseId, caseTitle]
      properties:
        kind: { type: string, enum: [query_response, case_submission] }
        title: { type: string }
        dueDate: { type: string, format: date }
        caseId: { type: integer }
        caseTitle: { type: string }
        queryId: { type: ["integer", "null"] }

    Case:
      type: object
      required: [id, title, caseType, status, isDemo, accessRole, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        referenceNumber: { type: ["string", "null"] }
        caseType:
          type: string
          enum: [lokayukta_da, income_tax_scrutiny, income_tax_assessment, other_financial, custom]
        investigatingAuthority: { type: ["string", "null"] }
        jurisdiction: { type: ["string", "null"] }
        subjectName: { type: ["string", "null"], description: Person whose finances are under investigation }
        periodStart: { type: ["string", "null"], format: date }
        periodEnd: { type: ["string", "null"], format: date }
        noticeDate: { type: ["string", "null"], format: date }
        noticeDetails: { type: ["string", "null"] }
        officerDetails: { type: ["string", "null"] }
        assignedAdvocate: { type: ["string", "null"] }
        assignedCa: { type: ["string", "null"] }
        status: { type: string, enum: [open, under_preparation, submitted, under_review, closed] }
        legislation: { type: ["string", "null"] }
        submissionDeadline: { type: ["string", "null"], format: date }
        isDemo: { type: boolean }
        accessRole: { type: string, enum: [owner, editor, reviewer, investigator], description: Current user's access to this case }
        createdAt: { type: string, format: date-time }
    CaseInput:
      type: object
      required: [title, caseType]
      properties:
        title: { type: string, minLength: 1 }
        referenceNumber: { type: ["string", "null"] }
        caseType: { type: string, enum: [lokayukta_da, income_tax_scrutiny, income_tax_assessment, other_financial, custom] }
        investigatingAuthority: { type: ["string", "null"] }
        jurisdiction: { type: ["string", "null"] }
        subjectName: { type: ["string", "null"] }
        periodStart: { type: ["string", "null"], format: date }
        periodEnd: { type: ["string", "null"], format: date }
        noticeDate: { type: ["string", "null"], format: date }
        noticeDetails: { type: ["string", "null"] }
        officerDetails: { type: ["string", "null"] }
        assignedAdvocate: { type: ["string", "null"] }
        assignedCa: { type: ["string", "null"] }
        status: { type: string, enum: [open, under_preparation, submitted, under_review, closed] }
        legislation: { type: ["string", "null"] }
        submissionDeadline: { type: ["string", "null"], format: date }
    CaseUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        referenceNumber: { type: ["string", "null"] }
        caseType: { type: string, enum: [lokayukta_da, income_tax_scrutiny, income_tax_assessment, other_financial, custom] }
        investigatingAuthority: { type: ["string", "null"] }
        jurisdiction: { type: ["string", "null"] }
        subjectName: { type: ["string", "null"] }
        periodStart: { type: ["string", "null"], format: date }
        periodEnd: { type: ["string", "null"], format: date }
        noticeDate: { type: ["string", "null"], format: date }
        noticeDetails: { type: ["string", "null"] }
        officerDetails: { type: ["string", "null"] }
        assignedAdvocate: { type: ["string", "null"] }
        assignedCa: { type: ["string", "null"] }
        status: { type: string, enum: [open, under_preparation, submitted, under_review, closed] }
        legislation: { type: ["string", "null"] }
        submissionDeadline: { type: ["string", "null"], format: date }
    CaseSummary:
      type: object
      required: [caseId, bankAccounts, statements, transactions, totalCredits, totalDebits, unclassified, suggested, unreconciled, assetsValue, liabilitiesValue, familyMembers, documents, openQueries, financialYears]
      properties:
        caseId: { type: integer }
        bankAccounts: { type: integer }
        statements: { type: integer }
        transactions: { type: integer }
        totalCredits: { type: number }
        totalDebits: { type: number }
        unclassified: { type: integer }
        suggested: { type: integer }
        unreconciled: { type: integer }
        assetsValue: { type: number }
        liabilitiesValue: { type: number }
        familyMembers: { type: integer }
        documents: { type: integer }
        openQueries: { type: integer }
        financialYears: { type: array, items: { type: string } }
        categoryBreakdown:
          type: array
          items:
            type: object
            required: [category, credits, debits, count]
            properties:
              category: { type: string }
              credits: { type: number }
              debits: { type: number }
              count: { type: integer }
    InvestigationPeriod:
      type: object
      required: [id, caseId, label, startDate, endDate, periodType]
      properties:
        id: { type: integer }
        caseId: { type: integer }
        label: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        periodType: { type: string, enum: [check_period, assessment_year, financial_year, custom] }
    InvestigationPeriodInput:
      type: object
      required: [label, startDate, endDate, periodType]
      properties:
        label: { type: string, minLength: 1 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        periodType: { type: string, enum: [check_period, assessment_year, financial_year, custom] }
    CaseShare:
      type: object
      required: [id, caseId, email, accessRole, createdAt]
      properties:
        id: { type: integer }
        caseId: { type: integer }
        email: { type: string }
        accessRole: { type: string, enum: [editor, reviewer, investigator] }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: ["string", "null"] }
    CaseShareInput:
      type: object
      required: [email, accessRole]
      properties:
        email: { type: string, format: email }
        accessRole: { type: string, enum: [editor, reviewer, investigator] }
        note: { type: ["string", "null"] }

    BankAccount:
      type: object
      required: [id, caseId, bankName, accountHolder, accountType, maskedAccountNumber, ownership, currency, transactionCount]
      properties:
        id: { type: integer }
        caseId: { type: integer }
        bankName: { type: string }
        accountHolder: { type: string }
        accountType: { type: string, enum: [savings, current, fixed_deposit, loan, credit_card, other] }
        maskedAccountNumber: { type: string }
        ifsc: { type: ["string", "null"] }
        branch: { type: ["string", "null"] }
        ownership: { type: string, enum: [self, spouse, joint, family_member, other] }
        familyMemberId: { type: ["integer", "null"] }
        jointHolders: { type: ["string", "null"] }
        openingDate: { type: ["string", "null"], format: date }
        closingDate: { type: ["string", "null"], format: date }
        currency: { type: string }
        transactionCount: { type: integer }
        firstTransactionDate: { type: ["string", "null"], format: date }
        lastTransactionDate: { type: ["string", "null"], format: date }
        totalCredits: { type: number }
        totalDebits: { type: number }
    BankAccountInput:
      type: object
      required: [bankName, accountHolder, accountType, maskedAccountNumber, ownership]
      properties:
        bankName: { type: string, minLength: 1 }
        accountHolder: { type: string, minLength: 1 }
        accountType: { type: string, enum: [savings, current, fixed_deposit, loan, credit_card, other] }
        maskedAccountNumber: { type: string, minLength: 1 }
        ifsc: { type: ["string", "null"] }
        branch: { type: ["string", "null"] }
        ownership: { type: string, enum: [self, spouse, joint, family_member, other] }
        familyMemberId: { type: ["integer", "null"] }
        jointHolders: { type: ["string", "null"] }
        openingDate: { type: ["string", "null"], format: date }
        closingDate: { type: ["string", "null"], format: date }
        currency: { type: string }
    StatementImportInput:
      type: object
      required: [fileName, fileType, content]
      properties:
        fileName: { type: string, minLength: 1 }
        fileType: { type: string, enum: [csv, xlsx, pdf] }
        content: { type: string, description: Raw CSV text for csv, base64 for xlsx/pdf }
        declaredOpeningBalance: { type: ["number", "null"] }
        declaredClosingBalance: { type: ["number", "null"] }
        documentId: { type: ["integer", "null"], description: Optional link to the stored original file in the document repository }
    StatementImportResult:
      type: object
      required: [statementId, status, rowsRead, imported, duplicatesSkipped, errors, warnings, balanceCheck]
      properties:
        statementId: { type: integer }
        status: { type: string, enum: [imported, imported_with_warnings, failed, unsupported] }
        rowsRead: { type: integer }
        imported: { type: integer }
        duplicatesSkipped: { type: integer }
        detectedColumns: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        balanceCheck:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [passed, failed, not_available] }
            computedClosing: { type: ["number", "null"] }
            declaredClosing: { type: ["number", "null"] }
            breaks: { type: integer, description: Rows where running balance did not equal previous balance + credit - debit }
    BankStatement:
      type: object
      required: [id, bankAccountId, fileName, fileType, status, rowsImported, duplicatesSkipped, fileHash, createdAt]
      properties:
        id: { type: integer }
        bankAccountId: { type: integer }
        bankName: { type: string }
        maskedAccountNumber: { type: string }
        fileName: { type: string }
        fileType: { type: string }
        fileHash: { type: string }
        status: { type: string }
        periodStart: { type: ["string", "null"], format: date }
