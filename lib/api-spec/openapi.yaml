        dateGapDays: { type: integer }
        evidence: { type: array, items: { type: string }, description: Matching signals (amount, date proximity, reference, description) }
        sourceTransactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
        targetTransactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
        reviewNote: { type: ["string", "null"] }
        createdBy: { type: string, enum: [engine, user] }
        reviewedAt: { type: ["string", "null"], format: date-time }
    ManualMatchInput:
      type: object
