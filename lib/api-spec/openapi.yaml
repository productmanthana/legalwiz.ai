openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FINTRACE API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: me
  - name: dashboard
  - name: cases
  - name: accounts
  - name: transactions
  - name: reconciliation
  - name: schedules
  - name: assets
  - name: family
  - name: queries
  - name: documents
  - name: legal
  - name: assistant
  - name: reports
  - name: audit
  - name: incomeTax
  - name: Storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpBody" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInBody" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      responses:
        "204":
          description: Signed out

  /me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
    patch:
      operationId: updateMe
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }

  /service-status:
    get:
      operationId: getServiceStatus
      tags: [me]
      responses:
        "200":
          description: External services availability
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceStatus" }

  /demo/seed:
    post:
      operationId: seedDemoCase
      tags: [cases]
      summary: Create a clearly labelled demo case with sample data for the current user
      responses:
        "201":
          description: Demo case created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /dashboard/financial-overview:
    get:
      operationId: getFinancialOverview
      tags: [dashboard]
      responses:
        "200":
          description: Credits/debits by financial year across accessible cases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FinancialYearTotal" }
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent audit activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }
  /dashboard/deadlines:
    get:
      operationId: getUpcomingDeadlines
      tags: [dashboard]
      responses:
        "200":
          description: Upcoming response and submission deadlines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deadline" }

  /cases:
    get:
      operationId: listCases
      tags: [cases]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: caseType, in: query, schema: { type: string } }
      responses:
        "200":
          description: Cases the user can access
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Case" }
    post:
      operationId: createCase
      tags: [cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
  /cases/{caseId}:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getCase
      tags: [cases]
      responses:
        "200":
          description: Case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
    patch:
      operationId: updateCase
      tags: [cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
    delete:
      operationId: deleteCase
      tags: [cases]
      responses:
        "204": { description: Deleted }
  /cases/{caseId}/summary:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getCaseSummary
      tags: [cases]
      responses:
        "200":
          description: Case summary metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseSummary" }
  /cases/{caseId}/periods:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listPeriods
      tags: [cases]
      responses:
        "200":
          description: Financial periods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InvestigationPeriod" }
    post:
      operationId: createPeriod
      tags: [cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestigationPeriodInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestigationPeriod" }
  /periods/{periodId}:
    parameters:
      - { name: periodId, in: path, required: true, schema: { type: integer } }
    delete:
      operationId: deletePeriod
      tags: [cases]
      responses:
        "204": { description: Deleted }
  /cases/{caseId}/shares:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listCaseShares
      tags: [cases]
      responses:
        "200":
          description: Sharing grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseShare" }
    post:
      operationId: createCaseShare
      tags: [cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseShareInput" }
      responses:
        "201":
          description: Shared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseShare" }
  /shares/{shareId}:
    parameters:
      - { name: shareId, in: path, required: true, schema: { type: integer } }
    delete:
      operationId: revokeCaseShare
      tags: [cases]
      responses:
        "204": { description: Revoked }

  /cases/{caseId}/bank-accounts:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listBankAccounts
      tags: [accounts]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BankAccount" }
    post:
      operationId: createBankAccount
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
  /bank-accounts/{accountId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateBankAccount
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
    delete:
      operationId: deleteBankAccount
      tags: [accounts]
      responses:
        "204": { description: Deleted }
  /bank-accounts/{accountId}/statements:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: importStatement
      tags: [accounts]
      summary: Import a CSV or Excel bank statement into the ledger
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatementImportInput" }
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementImportResult" }
  /cases/{caseId}/statements:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listStatements
      tags: [accounts]
      responses:
        "200":
          description: Imported statements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BankStatement" }

  /cases/{caseId}/transactions:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listTransactions
      tags: [transactions]
      parameters:
      - { name: accountId, in: query, schema: { type: integer } }
      - { name: category, in: query, schema: { type: string } }
      - { name: reviewStatus, in: query, schema: { type: string } }
      - { name: reconciliationStatus, in: query, schema: { type: string } }
      - { name: financialYear, in: query, schema: { type: string } }
      - { name: direction, in: query, schema: { type: string, enum: [credit, debit] } }
      - { name: minAmount, in: query, schema: { type: number } }
      - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
  /cases/{caseId}/transactions/suggest-classifications:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: suggestClassifications
      tags: [transactions]
      summary: Generate rule-based suggested categories for unclassified transactions (marked suggested until approved)
      responses:
        "200":
          description: Count of suggestions created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountResult" }
  /transactions/{transactionId}:
    parameters:
      - { name: transactionId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getTransaction
      tags: [transactions]
      responses:
        "200":
          description: Transaction with edit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionDetail" }
    patch:
      operationId: updateTransaction
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
  /transactions/{transactionId}/approve-suggestion:
    parameters:
      - { name: transactionId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: approveSuggestion
      tags: [transactions]
      responses:
        "200":
          description: Suggestion approved and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }

  /cases/{caseId}/reconciliation/run:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: runReconciliation
      tags: [reconciliation]
      summary: Find candidate matches (own-account transfers, family transfers, cash withdraw/redeposit, duplicates)
      responses:
        "200":
          description: Number of new candidate matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountResult" }
  /cases/{caseId}/reconciliation/summary:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getReconciliationSummary
      tags: [reconciliation]
      responses:
        "200":
          description: Status counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationSummary" }
  /cases/{caseId}/matches:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listMatches
      tags: [reconciliation]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TransactionMatch" }
    post:
      operationId: createManualMatch
      tags: [reconciliation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualMatchInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionMatch" }
  /matches/{matchId}:
    parameters:
      - { name: matchId, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: reviewMatch
      tags: [reconciliation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchReview" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionMatch" }

  /cases/{caseId}/ledger-entries:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listLedgerEntries
      tags: [schedules]
      responses:
        "200":
          description: Manually recorded income / receipt / expenditure entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }
    post:
      operationId: createLedgerEntry
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LedgerEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
  /ledger-entries/{entryId}:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateLedgerEntry
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LedgerEntryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
    delete:
      operationId: deleteLedgerEntry
      tags: [schedules]
      responses:
        "204": { description: Deleted }
  /cases/{caseId}/schedules/income-expenditure:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
      - { name: granularity, in: query, schema: { type: string, enum: [annual, quarterly, monthly] } }
    get:
      operationId: getIncomeExpenditureSchedule
      tags: [schedules]
      responses:
        "200":
          description: Period-wise income, receipts and expenditure with source references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeExpenditureSchedule" }
  /cases/{caseId}/schedules/da-calculation:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
      - { name: includeFamily, in: query, schema: { type: boolean } }
    get:
      operationId: getDaCalculation
      tags: [schedules]
      summary: Deterministic disproportionate-assets calculation (A/B/C/D) for the check period with full working
      responses:
        "200":
          description: Calculation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DaCalculation" }
  /cases/{caseId}/blind-spots:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listBlindSpots
      tags: [schedules]
      responses:
        "200":
          description: Issues for human examination
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlindSpot" }
  /cases/{caseId}/blind-spots/{code}:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
      - { name: code, in: path, required: true, schema: { type: string } }
    put:
      operationId: reviewBlindSpot
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlindSpotReview" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlindSpot" }

  /cases/{caseId}/tax-declarations:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listTaxDeclarations
      tags: [incomeTax]
      responses:
        "200":
          description: Figures recorded from ITR / AIS / TIS / Form 26AS / Form 16
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaxDeclaration" }
    post:
      operationId: createTaxDeclaration
      tags: [incomeTax]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxDeclarationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxDeclaration" }
  /tax-declarations/{declarationId}:
    parameters:
      - { name: declarationId, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateTaxDeclaration
      tags: [incomeTax]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxDeclarationInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxDeclaration" }
    delete:
      operationId: deleteTaxDeclaration
      tags: [incomeTax]
      responses:
        "204": { description: Deleted }
  /cases/{caseId}/income-tax/comparison:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getIncomeTaxComparison
      tags: [incomeTax]
      summary: Year-wise bank credits vs declared income, and AIS / 26AS vs ITR, head by head
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeTaxComparison" }

  /cases/{caseId}/assets:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listAssets
      tags: [assets]
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Asset" }
    post:
      operationId: createAsset
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
  /assets/{assetId}:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateAsset
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
    delete:
      operationId: deleteAsset
      tags: [assets]
      responses:
        "204": { description: Deleted }
  /cases/{caseId}/liabilities:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listLiabilities
      tags: [assets]
      responses:
        "200":
          description: Liabilities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Liability" }
    post:
      operationId: createLiability
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiabilityInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liability" }
  /liabilities/{liabilityId}:
    parameters:
      - { name: liabilityId, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateLiability
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiabilityInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liability" }
    delete:
      operationId: deleteLiability
      tags: [assets]
      responses:
        "204": { description: Deleted }

  /cases/{caseId}/family-members:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listFamilyMembers
      tags: [family]
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FamilyMember" }
    post:
      operationId: createFamilyMember
      tags: [family]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyMemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMember" }
  /family-members/{memberId}:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateFamilyMember
      tags: [family]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyMemberInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMember" }
    delete:
      operationId: deleteFamilyMember
      tags: [family]
      responses:
        "204": { description: Deleted }

  /cases/{caseId}/queries:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listQueries
      tags: [queries]
      responses:
        "200":
          description: Investigation queries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InvestigationQuery" }
    post:
      operationId: createQuery
      tags: [queries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestigationQueryInput" }
      responses:
        "201":
