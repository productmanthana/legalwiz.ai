        verifiedBy: { type: ["string", "null"] }
        verifiedAt: { type: ["string", "null"], format: date-time }
        verificationNote: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    LegalReferenceInput:
      type: object
      required: [sourceType, title]
      properties:
        sourceType: { type: string, enum: [judgment, statute, circular, rule, notification] }
        title: { type: string, minLength: 1 }
        court: { type: ["string", "null"] }
        decisionDate: { type: ["string", "null"], format: date }
        caseNumber: { type: ["string", "null"] }
        citation: { type: ["string", "null"] }
        provision: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"] }
        categories: { type: array, items: { type: string } }
        legalIssue: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
