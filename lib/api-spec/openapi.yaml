        sha256: { type: string }
        sizeBytes: { type: integer }
        contentType: { type: string }
        version: { type: integer }
        previousVersionId: { type: ["integer", "null"] }
        financialYear: { type: ["string", "null"] }
        isArchived: { type: boolean }
        isDuplicate: { type: boolean, description: Another document in this case has the same hash }
        transactionIds: { type: array, items: { type: integer } }
        uploadedBy: { type: ["string", "null"] }
        indexStatus:
          type: string
          enum: [not_indexed, queued, processing, indexed, failed]
          description: Search indexing status
        indexMethod: { type: ["string", "null"], description: "text | vision | mixed" }
        indexedPages: { type: integer }
        visionPages: { type: integer, description: Pages read by the vision model (scanned or containing images) }
