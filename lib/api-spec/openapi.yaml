        title: { type: string }
        court: { type: ["string", "null"] }
        decisionDate: { type: ["string", "null"], format: date }
        caseNumber: { type: ["string", "null"] }
        citation: { type: ["string", "null"] }
        provision: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"] }
