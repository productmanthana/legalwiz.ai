        checkPeriodEnd: { type: ["string", "null"], format: date }
        includeFamily: { type: boolean }
        components: { type: array, items: { $ref: "#/components/schemas/DaComponent" } }
        assetsAcquired: { type: number, description: B - A }
        likelySavings: { type: number, description: C - D }
        disproportion: { type: number, description: (B - A) - (C - D) }
        disproportionPercent: { type: ["number", "null"], description: disproportion / C x 100 }
        formula: { type: string }
        assumptions: { type: array, items: { type: string } }
        missingInformation: { type: array, items: { type: string } }
        templateVersion: { type: string }
        disclaimer: { type: string }
