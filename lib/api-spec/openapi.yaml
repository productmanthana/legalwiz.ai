        indexError: { type: ["string", "null"] }
        indexedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    DocumentInput:
      type: object
      required: [name, category, objectPath, sha256, sizeBytes, contentType]
      properties:
        name: { type: string, minLength: 1 }
        category:
          type: string
          enum: [bank_statement, itr, ais_tis, form_16, salary_slip, loan_document, property_deed, registration_receipt, valuation_report, gift_deed, inheritance_document, investment_statement, insurance_record, notice, legal_judgment, affidavit, other]
        description: { type: ["string", "null"] }
        objectPath: { type: string }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        sizeBytes: { type: integer }
        contentType: { type: string }
        financialYear: { type: ["string", "null"] }
        previousVersionId: { type: ["integer", "null"] }
    DocumentUpdate:
      type: object
      properties:
        category:
          type: string
          enum: [bank_statement, itr, ais_tis, form_16, salary_slip, loan_document, property_deed, registration_receipt, valuation_report, gift_deed, inheritance_document, investment_statement, insurance_record, notice, legal_judgment, affidavit, other]
        description: { type: ["string", "null"] }
        financialYear: { type: ["string", "null"] }
        transactionIds: { type: array, items: { type: integer } }

    LegalReference:
      type: object
