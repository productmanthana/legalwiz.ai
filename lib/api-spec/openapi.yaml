          enum: [own_account_transfer, family_transfer, cash_withdrawal_redeposit, duplicate_credit, loan_receipt_repayment, investment_purchase_redemption, other]
        sourceTransactionIds: { type: array, items: { type: integer }, minItems: 1 }
        targetTransactionIds: { type: array, items: { type: integer }, minItems: 1 }
        reviewNote: { type: ["string", "null"] }
    MatchReview:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected, partial] }
        reviewNote: { type: ["string", "null"] }
